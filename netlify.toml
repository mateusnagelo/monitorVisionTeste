[build]
  functions = "server/functions"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  publish = "dist"
  framework = "#custom"
  functions = "server/functions"

[[redirects]]
  from = "/api/*"
  to = "https://api.meudanfe.com.br/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cnpj/*"
  to = "https://publica.cnpj.ws/cnpj/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200